name: "Multi Event Pilpeline / workflow"
on:
  push:
    branches:
        - master
        - test  
  pull_request: # Event: Whenever a pull request is made to the repository
      branches:
          - master
      types: [closed]
  workflow_dispatch:
      


jobs:
    on-push:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps: 
            - name: "Running on Master Push"
              run: echo "Running on Master Push"

    on-pull-request:  # Job 2
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: "Running on pull request"
              run: echo "Running On Pull Request"

    on-pull_request_closed: 
        if: github.event_name == 'pull request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        steps: 
            - name: "Running on pull request closed"
              run: echo "Running on pull request closed"
              
    on-workflow_dispatch: # Job3
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:  # Steps to be executed in the Job 
            - name: "Running on workflow_dispatch"   # Step 1
              run: echo "Running on workflow_dispatch"
